[package]
name = "currawong-fuzz"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Entry points live in crates/fuzzstand and the crates' fuzz modules, so the
# stable `cargo test -p currawong-fuzzstand` runs the same code.
[dependencies]
libfuzzer-sys = "0.4"
currawong-smtp = { path = "../crates/smtp" }
currawong-parser-worker = { path = "../crates/parser-worker" }
currawong-fuzzstand = { path = "../crates/fuzzstand" }

[[bin]]
name = "smtp_command"
path = "fuzz_targets/smtp_command.rs"
test = false
doc = false
bench = false

