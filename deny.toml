[graph]
all-features = false

[advisories]
yanked = "warn"
unmaintained = "none"
ignore = [
    # Key generation on the appliance, and S/MIME key transport with the
    # recipient's public key. The rsa crate never decrypts or signs with a
    # private key on network input. Signing uses mail-auth's aws-lc backend.
    "RUSTSEC-2023-0071",
    # zip 8.6, pulled in by calamine (no zip 9 release yet); the parser worker
    # itself is on zip 9. All three advisories are in
    # `ZipArchive::extract` / `ZipStreamReader::extract` writing entries to a
    # directory (SUID bits, symlink targets, permissions through symlinks).
    # Currawong never extracts archives to disk: entries are read into memory
    # inside the sandboxed parser worker. Drop these once calamine is on zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # wasmtime and cranelift, through yara-x.
    "Apache-2.0 WITH LLVM-exception",
    # notify, for YARA rule hot reload.
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
