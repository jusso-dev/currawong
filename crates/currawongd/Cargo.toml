[package]
name = "currawongd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Currawong email security gateway daemon"
repository.workspace = true

[dependencies]
currawong-core = { path = "../core" }
currawong-smtp = { path = "../smtp" }
currawong-spool = { path = "../spool" }
currawong-auth = { path = "../auth" }
currawong-scan = { path = "../scan" }
currawong-classify = { path = "../classify" }
currawong-parser-worker = { path = "../parser-worker" }
currawong-policy = { path = "../policy" }
currawong-quarantine = { path = "../quarantine" }
currawong-dlp = { path = "../dlp" }
currawong-integrations = { path = "../integrations" }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
metrics = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }
zip = { workspace = true }
sevenz-rust2 = { workspace = true, features = ["compress"] }
tempfile = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
libc = { workspace = true }

# `cargo deb -p currawongd --no-build` after building all three binaries:
# cargo build --release --locked -p currawongd -p currawong-parser-worker -p currawong-setup-tui
[package.metadata.deb]
name = "currawong"
maintainer = "Currawong maintainers <noreply@github.com>"
copyright = "Currawong contributors"
license-file = ["../../LICENSE", "0"]
section = "mail"
priority = "optional"
depends = "$auto, adduser, openssl"
recommends = "clamav-daemon, clamav-freshclam"
extended-description = """\
Email security gateway for Australian organisations. Accepts mail on \
ports 25, 587 and 465, checks SPF, DKIM, DMARC and ARC, scans attachments \
in sandboxed parser workers and with ClamAV, and keeps mail on the host. \
Run currawong-setup to configure it."""
maintainer-scripts = "../../packaging/debian/"
assets = [
  ["target/release/currawongd", "usr/bin/", "755"],
  ["target/release/currawong-parser-worker", "usr/bin/", "755"],
  ["target/release/currawong-setup", "usr/sbin/", "755"],
  ["../../config/currawong.example.toml", "etc/currawong/currawong.toml", "640"],
  ["../../config/currawong.example.toml", "usr/share/doc/currawong/currawong.example.toml", "644"],
  ["../../README.md", "usr/share/doc/currawong/README.md", "644"],
]
systemd-units = { unit-name = "currawongd", unit-scripts = "../../packaging/systemd", enable = true, start = true, restart-after-upgrade = true }
