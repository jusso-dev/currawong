[package]
name = "currawong-parser-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "currawong_parser"
path = "src/lib.rs"

[[bin]]
name = "currawong-parser-worker"
path = "src/main.rs"

[dependencies]
currawong-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
mail-parser = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
cfb = { workspace = true }
sevenz-rust2 = { workspace = true }
rlimit = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
pdf-extract = { workspace = true }
calamine = { workspace = true }
yara-x = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
rqrr = { workspace = true }
regex = { workspace = true }
pdfium-render = { workspace = true, optional = true }

[features]
# Render the first PDF pages for QR codes. Needs the Pdfium shared library
# on the host at run time.
pdfium = ["dep:pdfium-render"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
qrcode = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
zip = { workspace = true }
sevenz-rust2 = { workspace = true, features = ["compress"] }
base64 = { workspace = true }
