# Currawong appliance: Debian 12, UEFI, systemd-boot, clamd and the
# currawong .deb. Boots to the currawong-setup wizard on tty1 and ttyS0.
# Needs mkosi v25 or later and target/debian/currawong_*_amd64.deb.
# Build: mkosi -C packaging/appliance build
# Output: packaging/appliance/mkosi.output/currawong-appliance.raw
# See docs/packaging.md for qcow2, VMDK and AMI conversion.

[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64

[Output]
ImageId=currawong-appliance
Format=disk
OutputDirectory=mkosi.output

[Build]
ToolsTree=default

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=tty0 console=ttyS0,115200
Hostname=currawong
WithDocs=no
# The locally built package. Built fresh every run, never cached.
PackageDirectories=../../target/debian
VolatilePackages=currawong
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        login
        passwd
        iproute2
        ca-certificates
        nftables
        unattended-upgrades
        clamav-daemon
        clamav-freshclam
        openssl
        adduser
        curl
