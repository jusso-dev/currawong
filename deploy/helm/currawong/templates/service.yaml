apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-currawong
  labels:
    app.kubernetes.io/name: currawong
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if ne .Values.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app.kubernetes.io/name: currawong
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: smtp, port: 25, targetPort: smtp }
    - { name: submission, port: 587, targetPort: submission }
    - { name: submissions, port: 465, targetPort: submissions }
---
# Headless service for the StatefulSet and for scraping metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-currawong-headless
  labels:
    app.kubernetes.io/name: currawong
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: currawong
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: metrics, port: 9090, targetPort: metrics }
