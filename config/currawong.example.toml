# Currawong example configuration.
# Every key is documented here. `currawongd --check-config` loads this file.
# Australian residency is the default. Message content is not sent off-box.

# log.format: "json" or "pretty".
# log.level: tracing filter used when RUST_LOG is unset.
[log]
format = "json"
level = "info"

# metrics.listen: Prometheus /metrics plus /healthz and /readyz.
[metrics]
listen = "127.0.0.1:9090"

# limits.max_message_bytes: at least 1 MiB. Default is 50 MiB.
# limits.max_recipients: recipients accepted in one transaction.
# limits.smtp_command_timeout_secs: idle timeout between SMTP commands, and
# the longest a reply write may block on a client that is not reading.
# limits.max_connections: process-wide connection cap.
# limits.max_line_bytes: RFC 5321 line limit, including the CRLF (1000 allows 998 octets).
# limits.max_connections_per_ip: per-address connection cap, shared by all listeners.
# limits.tls_handshake_timeout_secs: implicit TLS and STARTTLS handshake deadline.
# limits.data_timeout_secs: deadline for a whole DATA transfer (slow-drip clients).
# limits.spool_min_free_bytes: below this free space DATA gets 452 4.3.1.
[limits]
max_message_bytes = 52428800
max_recipients = 100
smtp_command_timeout_secs = 300
max_connections = 1000
max_line_bytes = 1000
max_connections_per_ip = 20
tls_handshake_timeout_secs = 30
data_timeout_secs = 600
spool_min_free_bytes = 1073741824

# spool.dir: absolute path. The 250 reply is sent only after an fsync.
[spool]
dir = "/var/spool/currawong"

# listeners.bind: host:port. Port 0 is rejected by --check-config.
# listeners.mode: plain, starttls or implicit.
# listeners.role: inbound (port 25) or submission (587/465).
[[listeners]]
name = "inbound"
bind = "0.0.0.0:25"
mode = "starttls"
role = "inbound"

[[listeners]]
name = "submission"
bind = "0.0.0.0:587"
mode = "starttls"
role = "submission"

[[listeners]]
name = "submissions"
bind = "0.0.0.0:465"
mode = "implicit"
role = "submission"

# tls.cert and tls.key: PEM paths. Reloaded on SIGHUP.
# tls.acme is not implemented yet. --check-config refuses a config that sets it.
[tls]
cert = "/etc/currawong/cert.pem"
key = "/etc/currawong/key.pem"

# scanner.enabled: isolated parser workers and the malware engines.
# scanner.worker_*: ADR 0002 resource limits. macOS dev builds skip seccomp.
# scanner.clamd.address: unix:/path or tcp:127.0.0.1:3310. Empty disables ClamAV.
#   clamd gets whole messages, so in au mode TCP must be loopback or an allowed CIDR.
# scanner.clamd.required: an unreachable required engine fails closed (defer).
# scanner.yara.rules_dir: *.yar and *.yara files (subdirectories included),
# matched against the raw message and every part inside the parser worker.
# Changes are picked up within a few seconds without a restart; a broken
# file, a misspelt action tag or an emptied directory is logged and the
# previous rules stay active. Tags `malware` and `suspicious` quarantine;
# other matches are recorded on the report for policy. If the rules cannot
# be loaded at all, mail fails closed. --check-config prints the rule and
# tag counts. Starter rules ship in rules/yara/. Empty disables YARA.
# scanner.yara.load_timeout_secs: time a worker may take to load the rules.
# scanner.extra_signature_dirs: on-premises supplemental signatures. Configure
# clamd to load these as well (OfficialDatabaseOnly no). Mail stays on the box.
# scanner.extra_database_paths: extra .cvd/.cld/.ndb files for the same purpose.
# scanner.blocked_extensions: active content even when ClamAV is clean.
# scanner.treat_macros_as_active / treat_executables_as_active: file-type policy.
# scanner.extract.*: archive limits (depth, uncompressed bytes, files, ratio).
[scanner]
enabled = true
worker_pool_size = 2
max_jobs_per_worker = 500
worker_memory_mib = 512
worker_cpu_secs = 30
job_timeout_secs = 30
blocked_extensions = [
  "exe", "scr", "js", "jse", "vbs", "vbe", "wsf", "wsh", "hta", "lnk", "iso",
  "one", "bat", "cmd", "com", "msi", "dll", "ps1", "jar", "cpl", "msc", "reg",
  "pif", "gadget", "application", "msp", "msix", "appx",
]
treat_macros_as_active = true
treat_executables_as_active = true
extra_signature_dirs = []
extra_database_paths = []

[scanner.clamd]
address = ""
required = true

[scanner.yara]
rules_dir = ""
load_timeout_secs = 120

[scanner.extract]
max_depth = 5
max_uncompressed_bytes = 209715200
max_files = 1000
max_ratio = 100

# residency.mode: "au" (default) or "off". "off" is refused unless
#   residency.off_approval = { reason = "...", approved_by = "..." } is set.
# residency.allowed_host_suffixes: Sydney and Melbourne object-storage names.
# residency.allowed_names: exact hostnames, never a GeoIP lookup.
# residency.allowed_cidrs: on-premises ranges. The defaults trust loopback and
#   every RFC 1918 range as on-premises. Narrow them to your own networks.
# residency.content_endpoints: sandbox, LLM, object store and webhook URLs
#   (http or https) checked at startup. A us-east-1 bucket fails in au mode.
#   scanner.clamd.address is checked too: unix:, loopback or an allowed CIDR.
# residency.overrides: audited exceptions (url, reason, approved_by).
# residency.signing_key_path: Ed25519 key for the residency report. Unset
#   means no signed report (currawongd logs a warning).
# residency.report_dir: signed reports (monthly, and at startup when the
#   residency config changed), 0600.
# residency.report_retention_days: reports older than this are deleted.
[residency]
mode = "au"
allowed_host_suffixes = [
  "s3.ap-southeast-2.amazonaws.com",
  "s3.ap-southeast-4.amazonaws.com",
]
allowed_names = ["localhost"]
allowed_cidrs = [
  "127.0.0.0/8",
  "::1/128",
  "10.0.0.0/8",
  "192.168.0.0/16",
  "172.16.0.0/12",
]
content_endpoints = []
overrides = []
report_dir = "/var/lib/currawong/residency"
report_retention_days = 400

# gateway.hostname: EHLO name and Received header.
[gateway]
hostname = "currawong.example.test"

# domains.accept: recipient domains. Anything else is relaying and needs auth.
# domains.routes: per-domain next hop, host or host:port, instead of MX.
[domains]
accept = ["example.test"]

[[domains.routes]]
domain = "example.test"
next_hop = "127.0.0.1:2526"

# delivery.poll_secs: how often deferred mail is retried.
# delivery.max_age_days: then a DSN, never to the null sender.
# delivery.require_tls: hook only. MTA-STS and DANE are not enforced in M1.
[delivery]
poll_secs = 30
max_age_days = 5
require_tls = false

# checks.*_enabled: each pre-DATA check can be turned off.
# checks.allow_cidrs: skip rate limits, DNSBL, greylisting and reputation.
# Trusted tenant networks and SMTP AUTH sessions skip them as well.
# Put published Microsoft and Google outbound ranges here; do not hard-code a
# stale copy into the binary.
# checks.dnsbl: zone, optional dqs_key (never logged) and 127.0.0.x codes.
[checks]
dnsbl_enabled = false
ratelimit_enabled = true
greylist_enabled = true
reputation_enabled = true
greylist_delay_secs = 300
greylist_database = "/var/lib/currawong/greylist.sqlite"
allow_cidrs = []
rate_per_minute_ip = 60
rate_per_minute_net = 300
rate_per_minute_sender = 120
reputation_reject_score = 100.0
reputation_half_life_secs = 86400
dnsbl = []

# relay.database: argon2 SMTP AUTH credentials. A login may send only as
# its own address (when the username is an address) or a listed alias.
# relay.tenants: trusted CIDRs and the domains that tenant may send as.
[relay]
database = "/var/lib/currawong/relay.sqlite"

[[relay.tenants]]
id = "example"
domains = ["example.test"]
trusted_cidrs = ["10.0.0.0/8"]

# dkim.kek_path: 32-byte AES-GCM key file. Private keys are encrypted at rest.
# It is created on first use; if it goes missing while keys exist, startup fails.
# dkim.sign_outbound: sign outbound tenant mail with every active key for the From domain.
#   A signing failure defers the message rather than sending it unsigned.
# dkim.seal_arc: ARC seal inbound mail a stage modified, with the "_gateway" tenant's key
#   for auth.authserv_id. Outbound mail never carries our Authentication-Results or ARC.
# Keys: currawongd --config ... dkim generate --tenant <id> --domain <d> --selector <s> [--algorithm rsa|ed25519]
#         (pending: publish the printed TXT record; it does not sign yet)
#       currawongd --config ... dkim activate --tenant <id> --domain <d> --selector <s>
#         (checks DNS serves the record, then signs; retires the previous key, keep it in DNS 7 days)
#       currawongd --config ... dkim records --tenant <id> --domain <d>  (pending/active/retired)
# Nothing is signed until the key database exists.
[dkim]
database = "/var/lib/currawong/dkim.sqlite"
kek_path = "/etc/currawong/dkim.kek"
sign_outbound = true
seal_arc = true

# auth.authserv_id: Authentication-Results identity. Forged copies are removed.
# auth.bimi: look up BIMI logos (default._bimi.<domain>) for quarantined mail
# that passes DMARC at p=quarantine or p=reject. VMC certificates are flagged,
# not verified.
[auth]
authserv_id = "currawong.example.test"
bimi = false

# auth.dmarc_reports: daily DMARC aggregate (RUA) reports for each sending
# domain, gzipped XML per RFC 9990, sent an hour after each UTC day ends. A rua
# address outside the policy domain is only used when it publishes
# <domain>._report._dmarc.<host>. Our own domains, IP literals and addresses
# whose MX is internal are refused. The max_* caps bound what a hostile DMARC
# record can make the gateway send. Failure (RUF) reports are never sent.
[auth.dmarc_reports]
enabled = false
database = "/var/lib/currawong/dmarc.sqlite"
org_name = "Example Pty Ltd"
email = "dmarc-reports@currawong.example.test"
max_rua_per_record = 5
max_domains_per_day = 5000
max_domains_per_org = 20
max_events_per_domain_day = 100000
max_rows_per_report = 1000
max_report_bytes = 5242880
retention_days = 7

# classify.enabled: spam score and lookalike domains on every report. Policy
# decides what a score means; classify does not quarantine on its own.
# classify.bayes_database: per-tenant Bayes token counts (hashes, not words).
# The directory must exist. If it cannot be opened, rules still score.
# classify.spam_rules_dir: directory of *.toml rules ([[rule]] name, target,
# pattern, score). Leave unset for the built-in rules in rules/spam/.
# classify.brands_file: "Name: domain ..." per line. Leave unset for the
# built-in Australian list in rules/brands-au.txt.
# classify.protected_domains: more domains to protect in every tenant's mail.
# Each relay tenant's own domains are protected in that tenant's mail only;
# an accepted domain with no tenant protects itself and has its own Bayes store.
# classify.allowed_domains: never flagged as lookalikes (partners or vendors
# whose names resemble a tenant's). Brand siblings are `!domain` entries in
# the brand list.
# --check-config opens the Bayes store when its directory exists.
[classify]
enabled = true
bayes_database = "/var/lib/currawong/bayes.sqlite"
protected_domains = []
allowed_domains = []

# policy.pack: TOML policy pack (see config/policies/default.toml). Unset uses the built-in default pack.
# policy.database: SQLite policy store, seeded from the pack the first time it is opened.
# policy.forward_domains: domains, beyond the recipient tenant's own, that redirect and bcc may target.
# Policies are reloaded on every pipeline pass.
[policy]
# pack = "/etc/currawong/policies.toml"
# database = "/var/lib/currawong/policy.db"
forward_domains = []

# url_rewrite: http(s) links in the text and HTML parts of delivered inbound
# mail become <base_url>/u/<token>. The token is an HMAC-SHA256 signature over
# the link, the message id and an expiry. Signed (S/MIME, PGP) parts,
# attachments and attached messages are left alone. A message that cannot be
# rewritten (over max_message_bytes, unparsable, more than 10,000 links) is
# delivered unchanged and the reason is in the scan report.
# url_rewrite.listen: the click service, plain HTTP. Put a TLS proxy for base_url in front of it.
# url_rewrite.key_file: at least 32 bytes, for example `openssl rand -hex 32 > url.key`.
#   Every node that serves clicks needs the same key. Changing it breaks delivered links.
# url_rewrite.blocklist: one domain (blocks subdomains too) or http(s) URL prefix per
#   line, read again when it changes, so a link blocked after delivery is refused at its
#   next click.
# url_rewrite.click_log: one JSON object per click (time, message id, link, action).
[url_rewrite]
enabled = false
base_url = "https://links.example.test"
listen = "127.0.0.1:8090"
key_file = "/etc/currawong/url.key"
ttl_days = 30
allow_domains = []
# blocklist = "/etc/currawong/url-blocklist.txt"
click_log = "/var/lib/currawong/clicks.jsonl"
max_message_bytes = 10485760

# dlp: TFN, Medicare, ABN, ACN, driver's licence and payment card detection.
# Outbound mail is scanned; set scan_inbound to scan inbound mail too.
# dlp.min_confidence: 0 to 100. A bare TFN or Medicare number scores 40; the
# word "TFN" nearby adds 30, anywhere in the text 15. Policies act on the
# distinct counts (`dlp.tfn` and so on) and the `dlp.incomplete` flag; the
# default pack holds outbound mail with 5 or more TFNs, Medicare, card or
# licence numbers, or an incomplete scan, in the `dlp` queue.
# Logs and events carry counts and redacted samples (`123 *** ***`) only.
[dlp]
enabled = true
scan_inbound = false
min_confidence = 50
