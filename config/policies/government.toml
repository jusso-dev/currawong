# Currawong government policy pack: the default pack plus PSPF protective
# marking enforcement for Australian Government tenants. Use it with
#
#   [policy]
#   pack = "/etc/currawong/policies/government.toml"
#
# It contains every default policy unchanged (a test checks this), so it
# replaces the default pack rather than adding to it. See docs/pspf.md.
#
# Markings come from the X-Protective-Marking header (preferred) or the
# [SEC=...] subject marking. Signals: `marking` / `marking_at_least`
# conditions on the classification (the highest level found in the header
# or any subject marking), and flags `pspf.invalid`, `pspf.mismatch`,
# `pspf.missing`, `pspf.caveat.<caveat>` and `pspf.access.<marker>`.
#
# PROTECTED may only go to government domains. Add more allowed domains as
# extra `not` conditions, for example `{ not = { recipient = "*@partner.example" } }`.
# Requiring TLS for PROTECTED mail needs the require_tls action (#35);
# until then, keep outbound TLS required for these domains in delivery config.

[[policy]]
id = "pspf-secret"
priority = 5
conditions = [{ direction = "outbound" }, { marking_at_least = "SECRET" }]
actions = [{ reject = { code = 550 } }]

[[policy]]
id = "pspf-protected-external"
priority = 6
conditions = [
    { direction = "outbound" },
    { marking_at_least = "PROTECTED" },
    { not = { recipient = "*@*.gov.au" } },
]
actions = [{ reject = { code = 550 } }]

[[policy]]
id = "pspf-invalid"
priority = 7
conditions = [{ direction = "outbound" }, { flag = "pspf.invalid" }]
actions = [{ quarantine = "pspf" }]

[[policy]]
id = "pspf-mismatch"
priority = 8
conditions = [{ direction = "outbound" }, { flag = "pspf.mismatch" }]
actions = [{ quarantine = "pspf" }]

# Government tenants must mark outbound mail. Unmarked mail is held.
# To stamp OFFICIAL on unmarked mail instead, disable this policy and enable
# pspf-default-marking below.
[[policy]]
id = "pspf-required"
priority = 9
conditions = [{ direction = "outbound" }, { flag = "pspf.missing" }]
actions = [{ quarantine = "pspf" }]

# Alternative to pspf-required: mark unmarked outbound mail OFFICIAL.
[[policy]]
id = "pspf-default-marking"
priority = 90
enabled = false
conditions = [{ direction = "outbound" }, { flag = "pspf.missing" }]
actions = [{ add_header = { name = "X-Protective-Marking", value = "VER=2018.6, NS=gov.au, SEC=OFFICIAL" } }]

# ---- Default pack policies (keep identical to default.toml) ----

[[policy]]
id = "active-content"
priority = 30
conditions = [{ flag = "active_content" }]
actions = [{ quarantine = "active-content" }]

[[policy]]
id = "html-smuggling"
priority = 31
conditions = [{ flag = "html_smuggling" }]
actions = [{ quarantine = "phishing" }]

# Active SVG: script, event handlers, `javascript:` or `data:text/html` links,
# HTML forms in `<foreignObject>`, or a redirect. Browsers run script in an
# SVG opened from disk, and phishing kits send them as attachments.
[[policy]]
id = "svg-active"
priority = 32
conditions = [{ flag = "svg_active" }]
actions = [{ quarantine = "phishing" }]

# VHD, VHDX, DMG and raw FAT/NTFS disk images. Windows mounts them and the
# files inside do not get the Mark of the Web. They are not unpacked, so they
# also fail closed as unscannable; this names the reason.
[[policy]]
id = "disk-image"
priority = 33
conditions = [{ flag = "disk_image" }]
actions = [{ quarantine = "active-content" }]

# OneNote sections with embedded files (a 2023 malware delivery route).
# Pictures are embedded files too, but `.one` is a blocked extension by
# default anyway. The files are extracted and scanned as parts.
[[policy]]
id = "onenote-embedded"
priority = 34
conditions = [{ flag = "onenote_embedded" }]
actions = [{ quarantine = "active-content" }]

# PDF JavaScript (`/JS`, `/JavaScript`, `/RichMedia`) and launch actions.
[[policy]]
id = "pdf-javascript"
priority = 35
conditions = [{ flag = "pdf_javascript" }]
actions = [{ quarantine = "active-content" }]

[[policy]]
id = "pdf-launch"
priority = 36
conditions = [{ flag = "pdf_launch" }]
actions = [{ quarantine = "active-content" }]

# Files embedded in a PDF are extracted and scanned like archive members, so
# the PDF itself is only tagged. `/OpenAction` and `/AA` are common in benign
# PDFs (open at a page, set the zoom, print), so they are only tagged too.
# `pdf_form` (XFA, SubmitForm) and `pdf_remote_action` (GoToR, GoToE) are
# signals with no default policy.
[[policy]]
id = "pdf-embedded-file-tag"
priority = 76
conditions = [{ flag = "pdf_embedded_file" }]
actions = [{ add_header = { name = "X-Currawong-PDF-Embedded-File", value = "present" } }]

[[policy]]
id = "pdf-auto-action-tag"
priority = 77
conditions = [{ flag = "pdf_auto_action" }]
actions = [{ add_header = { name = "X-Currawong-PDF-Auto-Action", value = "present" } }]

[[policy]]
id = "qr-code-tag"
priority = 75
conditions = [{ flag = "qr_code" }]
actions = [{ add_header = { name = "X-Currawong-QR-Code", value = "present" } }]

[[policy]]
id = "dmarc-reject"
priority = 50
conditions = [
    { auth = { method = "dmarc", result = "fail" } },
    { auth = { method = "dmarc_policy", result = "reject" } },
]
actions = [{ quarantine = "spoofing" }]

# Australian identifiers in outbound mail (`[dlp]` in the main config). Counts
# are distinct identifiers at or above `dlp.min_confidence`. ABNs and ACNs are
# on public registers, so they are counted (`dlp.abn`, `dlp.acn`) but not held.
# `dlp.incomplete` means some text could not be scanned (too large, a document
# that failed to parse, or documents outside the parser worker).
[[policy]]
id = "dlp-tfn"
priority = 40
conditions = [{ direction = "outbound" }, { count = { name = "dlp.tfn", at_least = 5 } }]
actions = [{ quarantine = "dlp" }]

[[policy]]
id = "dlp-medicare"
priority = 41
conditions = [{ direction = "outbound" }, { count = { name = "dlp.medicare", at_least = 5 } }]
actions = [{ quarantine = "dlp" }]

[[policy]]
id = "dlp-card"
priority = 42
conditions = [{ direction = "outbound" }, { count = { name = "dlp.card", at_least = 5 } }]
actions = [{ quarantine = "dlp" }]

[[policy]]
id = "dlp-driver-licence"
priority = 43
conditions = [{ direction = "outbound" }, { count = { name = "dlp.driver_licence", at_least = 5 } }]
actions = [{ quarantine = "dlp" }]

[[policy]]
id = "dlp-incomplete"
priority = 44
conditions = [{ direction = "outbound" }, { flag = "dlp.incomplete" }]
actions = [{ quarantine = "dlp" }]

# Business email compromise: impersonated staff, look-alike senders,
# diverted replies and payment or gift-card requests (inbound only).
[[policy]]
id = "bec-quarantine"
priority = 55
conditions = [{ direction = "inbound" }, { score = { name = "bec", at_least = 0.6 } }]
actions = [{ quarantine = "bec" }]

# Below the quarantine score, a borrowed colleague's name is still marked so
# mail clients and transport rules can warn the reader.
[[policy]]
id = "bec-warn"
priority = 56
conditions = [{ direction = "inbound" }, { flag = "bec.display_name_spoof" }]
actions = [{ add_header = { name = "X-Currawong-Warning", value = "possible impersonation of a colleague" } }]

[[policy]]
id = "spam-quarantine"
priority = 60
conditions = [{ score = { name = "spam", at_least = 8.0 } }]
actions = [{ quarantine = "spam" }]

# Subject rewriting needs a body rewrite the spool does not do yet, so the
# [SPAM] tag is carried in a header that mail clients can filter on.
[[policy]]
id = "spam-tag"
priority = 70
conditions = [{ score = { name = "spam", at_least = 5.0, below = 8.0 } }]
actions = [{ add_header = { name = "X-Currawong-Spam", value = "[SPAM]" } }]

# Links left without a click-time check (see the default pack).
[[policy]]
id = "url-rewrite-skipped-dmarc-fail"
priority = 79
conditions = [
    { direction = "inbound" },
    { flag = "url_rewrite.skipped" },
    { auth = { method = "dmarc", result = "fail" } },
]
actions = [{ quarantine = "url-rewrite" }]

[[policy]]
id = "url-rewrite-skipped"
priority = 80
conditions = [{ direction = "inbound" }, { flag = "url_rewrite.skipped" }]
actions = [{ add_header = { name = "X-Currawong-Links", value = "not-rewritten" } }]

[[policy]]
id = "url-rewrite-skipped-unauthenticated"
priority = 81
conditions = [
    { direction = "inbound" },
    { flag = "url_rewrite.skipped" },
    { not = { auth = { method = "dmarc", result = "pass" } } },
]
actions = [{ add_header = { name = "X-Currawong-Warning", value = "links from an unauthenticated sender were not checked" } }]

# Optional on-premises HTTP engines (#28); Bayes/rules remain independent.
[[policy]]
id = "rspamd-phishing"
priority = 37
conditions = [{ flag = "rspamd.phishing" }]
actions = [{ quarantine = "phishing" }]

[[policy]]
id = "rspamd-reject"
priority = 59
conditions = [{ flag = "rspamd.action.reject" }]
actions = [{ quarantine = "spam" }]

[[policy]]
id = "rspamd-add-header"
priority = 61
conditions = [{ flag = "rspamd.action.add_header" }]
actions = [{ add_header = { name = "X-Spam", value = "Yes" } }]

[[policy]]
id = "rspamd-rewrite-subject"
priority = 62
conditions = [{ flag = "rspamd.action.rewrite_subject" }]
actions = [{ add_header = { name = "X-Spam", value = "Yes" } }]

[[policy]]
id = "rspamd-greylist"
priority = 58
conditions = [{ flag = "rspamd.action.greylist" }]
actions = ["defer"]

[[policy]]
id = "rspamd-soft-reject"
priority = 58
conditions = [{ flag = "rspamd.action.soft_reject" }]
actions = ["defer"]

# Threat-intel feeds (`[intel]`): an attachment hash, a link, or a link's
# domain or address listed by a feed or by Spamhaus DQS. Each feed also
# raises `intel.<feed name>`, so a single noisy feed can be tagged instead.
[[policy]]
id = "intel-hash"
priority = 25
conditions = [{ flag = "intel.hash" }]
actions = [{ quarantine = "malware" }]

[[policy]]
id = "intel-url"
priority = 26
conditions = [{ flag = "intel.url" }]
actions = [{ quarantine = "phishing" }]

[[policy]]
id = "intel-domain"
priority = 27
conditions = [{ flag = "intel.domain" }]
actions = [{ quarantine = "phishing" }]

[[policy]]
id = "intel-ip"
priority = 28
conditions = [{ flag = "intel.ip" }]
actions = [{ quarantine = "phishing" }]

# RDAP age is supporting evidence, never a quarantine decision by itself.
# BEC reasons contribute to the existing 0.6 score policy.

[[policy]]
id = "new-domain-sender"
priority = 59
conditions = [{ flag = "domain.new_sender" }]
actions = [{ add_header = { name = "X-Currawong-New-Domain", value = "sender" } }]

[[policy]]
id = "new-domain-reply-to"
priority = 59
conditions = [{ flag = "domain.new_reply_to" }]
actions = [{ add_header = { name = "X-Currawong-New-Domain", value = "reply_to" } }]

[[policy]]
id = "new-domain-url"
priority = 59
conditions = [{ flag = "domain.new_url" }]
actions = [{ add_header = { name = "X-Currawong-New-Domain", value = "url" } }]
