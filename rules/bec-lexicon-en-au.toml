# Business email compromise lexicon (Australian English). Each phrase is
# matched case-insensitively on word boundaries in the subject and body.
# category: payment_change, gift_card, urgency, secrecy.
# A payment_change phrase only counts with a bank-detail pattern (BSB,
# account number) or a second payment_change phrase.

