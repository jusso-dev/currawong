# Business email compromise lexicon (Australian English). Each phrase is
# matched case-insensitively on word boundaries in the subject and body.
# Text and phrases are folded first (lower case, confusables mapped,
# punctuation and line breaks become single spaces), so `Gift-Cards` and a
# hard-wrapped `new bank\n details` still match.
# category: payment_change, invoice, gift_card, urgency, secrecy.
# payment_change counts with bank details (BSB or account number), a second
# payment_change phrase, or an invoice phrase. invoice alone never counts.

[[phrase]]
text = "change of bank details"
category = "payment_change"

[[phrase]]
text = "bank details have changed"
category = "payment_change"

[[phrase]]
text = "new bank details"
category = "payment_change"

[[phrase]]
text = "updated bank details"
category = "payment_change"

