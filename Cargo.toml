[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jusso-dev/currawong"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time", "process", "sync", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
axum = "0.8"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "serde-well-known"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
bytes = "1"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
ipnet = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
governor = "0.8"
dashmap = "6"
arc-swap = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
mail-parser = "0.11"
mail-auth = "0.13"
mail-send = { version = "0.5", default-features = false, features = ["ring", "tls12"] }
mail-builder = "0.4"
hickory-resolver = "0.26"
infer = "0.19"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
cfb = "0.10"
tempfile = "3"
http = "1"
libc = "0.2"
rlimit = "0.10"
pin-project-lite = "0.2"
rsa = { version = "0.9", features = ["sha2", "pem"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
zeroize = "1"
unicode-security = "0.1"
strsim = "0.11"
psl = "2"
idna = "1"
regex = "1"
proptest = "1"
