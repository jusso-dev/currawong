[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jusso-dev/currawong"

# DLP scans every outbound message. Optimise it in dev builds too so the
# hostile-input time bounds in its tests hold; debug assertions stay on.
[profile.dev.package.currawong-dlp]
opt-level = 2

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time", "process", "sync", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "serde-well-known"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
bytes = "1"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
ipnet = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
governor = "0.8"
dashmap = "6"
arc-swap = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
mail-parser = "0.11"
mail-auth = "0.13"
mail-send = { version = "0.5", default-features = false, features = ["ring", "tls12"] }
mail-builder = "0.4"
hickory-resolver = "0.26"
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
webpki-roots = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
infer = "0.19"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
cfb = "0.10"
tempfile = "3"
http = "1"
libc = "0.2"
rlimit = "0.10"
pin-project-lite = "0.2"
rsa = { version = "0.9", features = ["sha2", "pem"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
cms = { version = "0.2", features = ["builder"] }
x509-cert = "0.2"
zeroize = "1"
pdf-extract = "0.12"
calamine = { version = "0.36", default-features = false }
unicode-security = "0.1"
strsim = "0.11"
psl = "2"
idna = "1"
regex = "1"
# Default modules minus console, cuckoo, crx, dex, vt and the test protos.
yara-x = { version = "1.21", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "pe-module", "dotnet-module", "elf-module", "lnk-module", "macho-module", "math-module", "hash-module", "string-module", "time-module", "zip-module"] }
notify = "8"
proptest = "1"

# Argon2 is unusably slow unoptimised; SMTP AUTH tests hash and verify passwords.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# RSA-2048 key generation is very slow unoptimised, and tests generate keys.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
